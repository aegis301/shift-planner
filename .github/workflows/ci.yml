name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge latest base branch
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/merge-latest-base.sh"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app
      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge latest base branch
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/merge-latest-base.sh"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge latest base branch
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/merge-latest-base.sh"
      - name: Build and start production app services
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          SESSION_SECRET: ci-session-secret
          SESSION_COOKIE_SECURE: "true"
          BACKEND_CORS_ORIGINS: https://shift-planner.example.invalid
          NEXT_PUBLIC_API_BASE_URL: ""
        run: docker compose -f docker-compose.prod.yml up -d --build postgres backend frontend
      - name: Wait for backend health and frontend startup
        run: |
          set -eu
          for _ in $(seq 1 60); do
            BACKEND_ID="$(docker compose -f docker-compose.prod.yml ps -q backend)"
            FRONTEND_ID="$(docker compose -f docker-compose.prod.yml ps -q frontend)"
            BACKEND_HEALTH="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$BACKEND_ID")"
            FRONTEND_STATUS="$(docker inspect -f '{{.State.Status}}' "$FRONTEND_ID")"
            if [ "$BACKEND_HEALTH" = "healthy" ] && [ "$FRONTEND_STATUS" = "running" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become healthy/running in time."
          docker compose -f docker-compose.prod.yml logs backend frontend
          exit 1
      - name: Validate backend health endpoint
        run: docker compose -f docker-compose.prod.yml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read()"
      - name: Shutdown smoke environment
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans
