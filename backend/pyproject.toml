[project]
name = "shift-planner-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-first shift planner."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "email-validator>=2.1.0",
  "icalendar>=6.0.0",
  "fastapi>=0.115.0",
  "itsdangerous>=2.2.0",
  "openpyxl>=3.1.5",
  "passlib>=1.7.4",
  "psycopg>=3.2.0,<3.4",
  "pydantic-settings>=2.5.0",
  "python-multipart>=0.0.9",
  "reportlab>=4.2.5",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]
