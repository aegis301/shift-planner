services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shift_planner}
      POSTGRES_USER: ${POSTGRES_USER:-shift_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shift_planner}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shift_planner} -d ${POSTGRES_DB:-shift_planner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://shift_planner:shift_planner@postgres:5432/shift_planner}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      DOCTOR_SEED_PASSWORD: ${DOCTOR_SEED_PASSWORD:-change-me-doctors}
      DEFAULT_ORGANIZATION_ID: ${DEFAULT_ORGANIZATION_ID:-1}
      PLANNER_SEED_EMAIL: ${PLANNER_SEED_EMAIL:-}
      PLANNER_SEED_PASSWORD: ${PLANNER_SEED_PASSWORD:-change-me-planner}
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-change-me-mcp-token}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python -m app.scripts.seed_admin && python -m app.scripts.seed_doctor_users && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  mcp:
    build:
      context: ./mcp-server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://shift_planner:shift_planner@postgres:5432/shift_planner}
      PYTHONPATH: /workspace/backend:/app
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      DEFAULT_ORGANIZATION_ID: ${DEFAULT_ORGANIZATION_ID:-1}
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-change-me-mcp-token}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/workspace/backend
      - ./mcp-server:/app
    command: python -m mcp_app.server

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  frontend_node_modules:
